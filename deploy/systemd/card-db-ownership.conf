# 可选：让服务在每次启动前自动对齐对象归属（自愈，幂等，0.1s 级开销）。
#
# 安装：
#   cp deploy/card-db-ownership.sh /opt/sub2api-copy/
#   cp deploy/systemd/card-db-ownership.conf \
#      /etc/systemd/system/sub2api-copy.service.d/card-db-ownership.conf
#   # 按需改上面的路径/库名，然后：
#   systemctl daemon-reload
#
# 说明：
#   - ExecStartPre 前缀 '+' 表示以全权限运行（忽略 unit 的 User=），再经 runuser
#     切到 postgres 走 peer 认证，因此无需在 unit 里存任何口令；
#   - 失败不阻塞启动（前缀 '-'）：归属已对齐时该命令无副作用，未对齐时迁移会失败，
#     由 journal 暴露原因，operator 决定处置；
#   - 不需要自愈能力时可不安装本文件，改为部署前手工执行一次 card-db-ownership.sh。
[Service]
ExecStartPre=-+/usr/bin/runuser -u postgres -- /bin/sh /opt/sub2api-copy/card-db-ownership.sh sub2api sub2api
