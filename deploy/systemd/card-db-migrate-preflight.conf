# 升级包 pre-step drop-in：启动前以 DB 属主身份补跑迁移（见 deploy/CARD_DB_UPGRADE.md）
#
# 安装：
#   cp deploy/card-db-migrate-preflight.sh /opt/sub2api-copy/
#   cp deploy/systemd/card-db-migrate-preflight.conf \
#      /etc/systemd/system/sub2api-copy.service.d/
#   systemctl daemon-reload
#
# 安装后升级流程 = 换二进制 + systemctl restart（pre-step 自动补迁移）。
#
# 注意（2026-09-17 dev 演练踩到的两个坑，已修）：
#   1. runuser 不在 /usr/bin（Ubuntu 在 /usr/sbin）——脚本内用 PATH 查找并给出明确报错；
#   2. pre-step 不静默：故意**不加** systemd 的 '-' 前缀，迁移失败时服务直接不启动，
#      journal 里能看到根因（迁移跑不了、服务起来也是坏的）。
[Service]
ExecStartPre=+/bin/sh /opt/sub2api-copy/card-db-migrate-preflight.sh
