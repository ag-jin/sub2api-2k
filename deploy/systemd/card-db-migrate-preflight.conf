# 升级包 pre-step：以数据库属主身份补跑迁移，免除"表归属"处理（推荐）
#
# 背景：上游 v0.2.x 起 SQL 迁移改为服务启动必跑；而本仓 dev/生产库由 dump 以
# postgres 恢复、对象归 postgres，应用角色 sub2api 无归属权，启动迁移会失败：
#   apply migration 229_plugins.sql: pq: must be owner of table sub2api_plugin_bindings
#
# 机制：本 pre-step 在服务启动前，用**同一个二进制**的 --migrate-only 走
# MIGRATION_DATABASE_DSN（unix socket + peer 认证，unit 里不存任何口令），以
# postgres 身份把待应用迁移跑完；随后服务启动时迁移已是 no-op，归属不再影响运行。
# dev 实测（人为把表改回 postgres 属主 + 摘掉一条迁移记录）：pre-step 退出 0、
# 迁移记录补齐、表归属无需改动。
#
# 安装（生产）：
#   cp deploy/systemd/card-db-migrate-preflight.conf \
#      /etc/systemd/system/sub2api-copy.service.d/card-db-migrate-preflight.conf
#   systemctl daemon-reload
# 安装后升级流程 = 换二进制 + systemctl restart（pre-step 自动补迁移）。
#
# 说明：
#   - 前缀 '-'：pre-step 失败不阻塞启动（迁移真失败时服务自身启动迁移仍会报错，
#     journal 里两条线索都在）；
#   - DSN 用 unix socket（host=/var/run/postgresql）走 peer 认证；若 PostgreSQL
#     不在本机/需要口令，请改成 host=127.0.0.1 user=postgres password=... 形式；
#   - 库名/角色随环境调整（下方 sub2api 为库名，runuser 的 postgres 为 OS 用户）。
[Service]
Environment=MIGRATION_DATABASE_DSN=host=/var/run/postgresql dbname=sub2api sslmode=disable
ExecStartPre=-+/usr/bin/runuser -u postgres -- /opt/sub2api-copy/sub2api --migrate-only
